# Single-host deployment. backend + ai_service SHARE one `storage` volume (the SQLite DB + files),
# so they must run on the same Docker host. `web` (Caddy) terminates TLS, serves the built SPA, and
# proxies /api -> backend, /ai -> ai_service (WebSocket-aware).
#
# Set DOMAIN and ACME_EMAIL for compose (repo-root .env or your shell), and put real runtime
# config in backend/.env and ai_service/.env (loaded via env_file). Then:  docker compose up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env         # runtime config -> container env -> pydantic Settings
    environment:
      - RELOAD=0                      # single worker (the auto-schedule sweep must not run twice)
      - STORAGE_DIR=/app/storage      # MUST equal the volume mount below (overrides .env) so both
                                      # services share one DB; otherwise resumes stay "queued".
    volumes:
      - storage:/app/storage          # SHARED DB + resumes/transcripts/recordings
    restart: unless-stopped
    expose:
      - "8000"

  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    env_file: ./ai_service/.env
    environment:
      - RELOAD=0                      # single worker (in-process interview state) — NEVER scale
      - STORAGE_DIR=/app/storage      # SAME absolute path as backend -> one shared DB
      - TTS_SERVICE_URL=http://tts_service:8200   # English TTS microservice (DNS round-robins replicas)
    volumes:
      - storage:/app/storage          # SAME volume as backend
    restart: unless-stopped
    expose:
      - "8100"
    depends_on:
      - backend
      - tts_service

  # Standalone English TTS. Default engine Pocket TTS (natural, ~real-time on CPU); TTS_ENGINE=kitten
  # for the tiny fast model — set in tts_service/.env. STATELESS and horizontally scalable — unlike
  # ai_service it is safe (and intended) to run multiple replicas: `docker compose up -d --scale
  # tts_service=N`. Docker's embedded DNS round-robins `tts_service` across them, so ai_service needs
  # no change to scale out. Per-container concurrency is bounded IN-APP (TTS_MAX_CONCURRENCY).
  tts_service:
    build:
      context: .
      dockerfile: tts_service/Dockerfile
    env_file: ./tts_service/.env      # its own config — voice + concurrency knobs (see .env.example)
    environment:
      - RELOAD=0                      # one uvicorn worker per container; scale by replicas, not workers
    restart: unless-stopped
    expose:
      - "8200"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - DOMAIN=${DOMAIN:-localhost}                    # used by the Caddyfile for TLS + routing
      - ACME_EMAIL=${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data              # persists issued TLS certs across restarts
      - caddy_config:/config
    depends_on:
      - backend
      - ai_service
    restart: unless-stopped

volumes:
  storage:       # the ONE shared data volume for backend + ai_service
  caddy_data:
  caddy_config:
