# =============================================================================
# AI Recruitment Platform — production nginx site config
#
# Serves the built frontend SPA and reverse-proxies the two backend services on one host.
#
#   https://yourco.com            -> SPA (recruiter portal; admin usage panel at /admin)
#   /api/*  -> backend    :8000   (PASSED THROUGH AS-IS — backend serves natively at /api/*)
#   /ai/*   -> ai_service :8100   (PASSED THROUGH AS-IS — WebSocket interview at /ai/interview/*)
#
# Both backend and ai_service mount their routers under /api and /ai respectively
# (see backend/app/main.py, ai_service/app/main.py), so nginx does NO path rewriting here —
# it just forwards the request URI unchanged. This is why proxy_pass below has NO trailing
# path component: `proxy_pass http://upstream;` (no trailing "/") preserves the original URI.
#
# Install:  /etc/nginx/sites-available/airecruit  -> symlink into sites-enabled
#           nginx -t && systemctl reload nginx
#
# Replace: yourco.com  and  /var/www/airecruit/dist  and the cert paths.
# =============================================================================

upstream airecruit_backend {
    # Bare metal / systemd. For docker-compose use the service name: server backend:8000;
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream airecruit_ai {
    # For docker-compose: server ai_service:8100;
    server 127.0.0.1:8100;
    keepalive 32;
}

# --- HTTP -> HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yourco.com;

    # Let certbot answer HTTP-01 challenges (if you use them for the apex).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# --- Main HTTPS server -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 uses this directive. On OLDER nginx, delete this line and instead write
    # the listen lines as:  listen 443 ssl http2;  /  listen [::]:443 ssl http2;
    http2 on;

    #   certbot certonly --webroot -w /var/www/certbot -d yourco.com
    server_name yourco.com;

    ssl_certificate     /etc/letsencrypt/live/yourco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourco.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/airecruit/dist;   # output of `npm run build`
    index index.html;

    # Bulk resume upload: 15 MB per file, many files per request. nginx defaults to 1 MB,
    # which would fail uploads with 413 — raise it.
    client_max_body_size 100m;

    # Logs
    access_log /var/log/nginx/airecruit.access.log;
    error_log  /var/log/nginx/airecruit.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # Backend REST API — served natively at /api/* (e.g. /api/auth/login). PASS THROUGH: no
    # trailing "/" on proxy_pass, so nginx forwards the original /api/... URI unchanged.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://airecruit_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;   # resume upload + Claude-backed endpoints
        proxy_send_timeout    120s;
    }

    # Health check for the backend, at nginx's own /health (bypasses the /api namespace —
    # infra probes conventionally hit an unprefixed /health). Backend also serves /health
    # unprefixed at its root, matching this 1:1.
    location = /health {
        proxy_pass http://airecruit_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # AI service — served natively at /ai/* (e.g. /ai/interview/{token} WebSocket).
    # PASS THROUGH: no trailing "/" on proxy_pass, original /ai/... URI forwarded unchanged.
    # -------------------------------------------------------------------------
    location /ai/ {
        proxy_pass http://airecruit_ai;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # Interviews run ~30 min; nginx's 60s default would cut the call off mid-sentence.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;      # stream audio/messages without buffering
    }

    # -------------------------------------------------------------------------
    # Hashed static assets — safe to cache forever.
    # (nginx drops inherited add_header when a block defines its own, which is fine here:
    #  cross-origin isolation only needs to be on the DOCUMENT, not same-origin subresources.)
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA: serve index.html for all client-side routes (/login, /recruitments, /admin,
    # /interview/:token, ...). These must NOT be cached, or users get a stale bundle.
    #
    # COOP + COEP are REQUIRED: they make the page cross-origin isolated so the in-browser
    # Pocket TTS WASM can run multi-threaded. Without them the agent's voice breaks up.
    # (Must be repeated here — nginx does not inherit add_header into a block that sets any.)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache"    always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
